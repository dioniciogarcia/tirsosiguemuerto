name: Build WorkspaceHelper Watch APK

on:
  push:
    branches: [ main ]
    paths:
      - 'watch-app/**'
      - '.github/workflows/build-watch-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watch-app
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK (preinstalled on the runner)
        working-directory: .
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk WorkspaceHelper-Watch.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkspaceHelper-Watch-apk
          path: watch-app/WorkspaceHelper-Watch.apk

      - name: Publish to the watch release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: watch-latest
          name: Watch app (latest)
          files: watch-app/WorkspaceHelper-Watch.apk
