name: Build WorkspaceHelper APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk WorkspaceHelper.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkspaceHelper-apk
          path: android-app/WorkspaceHelper.apk

      - name: Publish to the app release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Android app (latest)
          files: android-app/WorkspaceHelper.apk
