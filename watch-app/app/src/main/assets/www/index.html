<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorkspaceHelper</title>
<style>
  :root{--bg:#000;--card:#0C0E12;--text:#F4F6FA;--muted:#9AA3B2;--accent:#7C6CF6;--accent2:#A99BFF;--green:#34D399;--rose:#FB7185;--ring:#262B36}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,Roboto,system-ui,sans-serif;overflow:hidden}
  button{font-family:inherit;cursor:pointer;border:none}
  .wrap{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
  .hidden{display:none!important}
  /* HOME ring */
  #home{position:relative;width:100vw;height:100vh}
  .ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from -90deg,var(--green) 0% var(--pct,0%),var(--ring) var(--pct,0%) 100%)}
  .inner{position:absolute;inset:7%;border-radius:50%;background:var(--card)}
  .center{position:absolute;inset:7%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 14%}
  .pip{position:absolute;top:11%;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;font-size:3.1vw;font-weight:600}
  .tt{font-size:3.3vw;font-weight:600;letter-spacing:.12em;color:var(--muted)}
  .big{font-size:11vw;font-weight:700;line-height:1}
  .sub{font-size:3.3vw;color:var(--muted);margin-top:1vw}
  .acts{display:flex;gap:4.5vw;margin-top:4vw}
  .rbtn{width:15vw;height:15vw;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4vw;font-size:2.6vw;font-weight:700}
  .stop{background:#2A1619;color:var(--rose)}
  .f9{background:#10271F;color:var(--green)}
  .gear{position:absolute;bottom:9%;left:50%;transform:translateX(-50%);width:9vw;height:9vw;border-radius:50%;background:#171A21;color:#C7CDD9;display:flex;align-items:center;justify-content:center}
  .dot{width:1.8vw;height:1.8vw;border-radius:50%}
  /* generic panels (setup/settings) */
  .panel{width:100vw;height:100vh;overflow-y:auto;padding:22vw 10vw;text-align:center}
  .panel h2{font-size:5vw;margin:0 0 3vw}
  input,select{width:100%;background:#0F1218;border:1px solid var(--ring);border-radius:3vw;color:var(--text);padding:3.2vw;font-size:3.6vw;margin-top:2vw}
  .pbtn{width:100%;background:var(--accent);color:#fff;border-radius:4vw;padding:3.6vw;font-size:3.8vw;font-weight:700;margin-top:4vw}
  .pbtn.ghost{background:#1C202A;color:#C7CDD9}
  .seg{display:flex;gap:1.5vw;background:#0F1218;border:1px solid var(--ring);border-radius:3vw;padding:1.3vw;margin-top:2vw}
  .seg button{flex:1;background:transparent;color:var(--muted);font-weight:600;font-size:3.4vw;padding:2.6vw 0;border-radius:2.2vw}
  .seg button.on{background:#241E3C;color:var(--accent2)}
  svg{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>

<!-- SETUP -->
<div id="setup" class="panel hidden">
  <h2>WorkspaceHelper</h2>
  <input id="in_url" placeholder="Firebase URL" autocapitalize="off" autocorrect="off" spellcheck="false">
  <input id="in_secret" placeholder="Firebase secret" autocapitalize="off" autocorrect="off" spellcheck="false">
  <button class="pbtn" onclick="saveSetup()" id="t_connect">Connect</button>
</div>

<!-- HOME -->
<div id="home" class="hidden">
  <div class="ring"></div>
  <div class="inner"></div>
  <div class="pip"><span class="dot" id="pip_dot" style="background:var(--muted)"></span><span id="pip_t" style="color:var(--muted)">—</span></div>
  <div class="center">
    <div class="tt">DESKTIME</div>
    <div class="big" id="w_total">—</div>
    <div class="sub" id="w_sub">—</div>
    <div class="acts">
      <button class="rbtn stop" onclick="send('desktime_stop')"><svg width="16" height="16" viewBox="0 0 24 24" style="stroke:none;fill:currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg><span>STOP</span></button>
      <button class="rbtn f9" onclick="send('mouse_start',{minutes:0})"><svg width="15" height="15" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="16" rx="5"/><path d="M12 6v3"/></svg><span>F9</span></button>
    </div>
    <button class="gear" onclick="show('settings')"><svg width="15" height="15" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.6-2-3.4-2.4 1a7 7 0 0 0-1.7-1L16.5 2h-4l-.3 2.6a7 7 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 1.7 1l.3 2.4h4l.3-2.6a7 7 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6a7 7 0 0 0 .1-1z"/></svg></button>
  </div>
</div>

<!-- SETTINGS -->
<div id="settings" class="panel hidden">
  <h2 id="t_settings">Settings</h2>
  <select id="dev_select" onchange="selectDevice(this.value)"></select>
  <div class="seg"><button id="lang_en" onclick="setLang('en')">EN</button><button id="lang_es" onclick="setLang('es')">ES</button></div>
  <button class="pbtn ghost" onclick="show('home')" id="t_back">Back</button>
  <button class="pbtn ghost" onclick="editConnection()" id="t_edit">Edit connection</button>
</div>

<script>
const T={en:{connect:"Connect",settings:"Settings",back:"Back",edit:"Edit connection",online:"online",offline:"offline",running:"Running",stopped:"Stopped",sent:"Sent"},
         es:{connect:"Conectar",settings:"Ajustes",back:"Atrás",edit:"Editar conexión",online:"en línea",offline:"sin conexión",running:"En marcha",stopped:"Detenido",sent:"Enviado"}};
let lang=localStorage.getItem('lang')||'en';
function t(k){return (T[lang]&&T[lang][k])||k;}
function applyLang(){
  document.getElementById('t_connect').textContent=t('connect');
  document.getElementById('t_settings').textContent=t('settings');
  document.getElementById('t_back').textContent=t('back');
  document.getElementById('t_edit').textContent=t('edit');
  document.getElementById('lang_en').classList.toggle('on',lang==='en');
  document.getElementById('lang_es').classList.toggle('on',lang==='es');
}
function setLang(l){lang=l;localStorage.setItem('lang',l);applyLang();refresh();}

let cfg=JSON.parse(localStorage.getItem('cfg')||'null');
let deviceId=localStorage.getItem('deviceId')||'';
let pollTimer=null;
function fbUrl(p){return cfg.url.replace(/\/$/,'')+'/'+p+'.json?auth='+encodeURIComponent(cfg.secret);}
async function fbGet(p){try{return await (await fetch(fbUrl(p))).json();}catch(e){return undefined;}}
async function fbPost(p,b){try{await fetch(fbUrl(p),{method:'POST',body:JSON.stringify(b)});return true;}catch(e){return false;}}

function saveSetup(){
  const url=document.getElementById('in_url').value.trim();
  const secret=document.getElementById('in_secret').value.trim();
  if(!url||!secret)return;
  cfg={url,secret};localStorage.setItem('cfg',JSON.stringify(cfg));boot();
}
function editConnection(){localStorage.removeItem('cfg');cfg=null;boot();}
function show(v){['setup','home','settings'].forEach(s=>document.getElementById(s).classList.toggle('hidden',s!==v));}

async function send(type,args){
  if(!deviceId)return;
  await fbPost('devices/'+deviceId+'/commands',{type,args:args||{},ts:Date.now()});
}
async function loadDevices(){
  const d=await fbGet('devices');const sel=document.getElementById('dev_select');sel.innerHTML='';
  if(!d){return;}const ids=Object.keys(d);
  ids.forEach(id=>{const nm=(d[id].status&&d[id].status.device_name)||id;const o=document.createElement('option');o.value=id;o.textContent=nm;sel.appendChild(o);});
  if(!deviceId||ids.indexOf(deviceId)<0){deviceId=ids[0]||'';localStorage.setItem('deviceId',deviceId);}
  sel.value=deviceId;
}
function selectDevice(id){deviceId=id;localStorage.setItem('deviceId',id);refresh();}
function hms(s){s=s||0;return Math.floor(s/3600)+'h '+String(Math.floor((s%3600)/60)).padStart(2,'0')+'m';}
async function refresh(){
  if(!cfg||!deviceId)return;
  const st=await fbGet('devices/'+deviceId+'/status');
  const online=st&&st.online&&(Date.now()/1000-(st.ts||0)<30);
  document.getElementById('pip_dot').style.background=online?'var(--green)':'var(--rose)';
  const pt=document.getElementById('pip_t');pt.textContent='PC '+(online?t('online'):t('offline'));pt.style.color=online?'#6EE7B7':'var(--rose)';
  const running=st&&st.desktime_running;
  const h=st&&st.hours;
  const pct=h?Math.round(h.productivity||0):0;
  document.querySelector('.ring').style.setProperty('--pct',pct+'%');
  document.getElementById('w_total').textContent=h?hms(h.desktimeTime):'—';
  document.getElementById('w_sub').textContent=(running?t('running'):t('stopped'))+(h?' · '+pct+'%':'');
}
async function boot(){
  applyLang();
  if(!cfg){show('setup');return;}
  show('home');await loadDevices();await refresh();
  if(pollTimer)clearInterval(pollTimer);
  pollTimer=setInterval(refresh,5000);
}
boot();
</script>
</body>
</html>
