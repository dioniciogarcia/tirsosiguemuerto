plugins {
    id 'com.android.application'
}

android {
    namespace 'com.workspacehelper.watch'
    compileSdk 34

    defaultConfig {
        applicationId "com.workspacehelper.watch"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.2.0"

        // Baked in at build time from the FIREBASE_SECRET GitHub secret, so the
        // watch connects with no typing. Empty when not provided -> the watch
        // falls back to the manual Setup screen.
        buildConfigField "String", "FIREBASE_SECRET", "\"${System.getenv('FIREBASE_SECRET') ?: ''}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
