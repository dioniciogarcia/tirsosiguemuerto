plugins {
    id 'com.android.application'
}

android {
    namespace 'com.workspacehelper.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.workspacehelper.app"
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName "1.5.0"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.all {
    resolutionStrategy {
        // androidx.biometric 1.1.0 drags in an old kotlin-stdlib-jdk8 that
        // clashes with the newer kotlin-stdlib. Pin them to one version.
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
    }
}

dependencies {
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.core:core:1.12.0'
}
