<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WorkspaceHelper</title>
<style>
  :root{ --bg:#0D0F14; --surface:#171A21; --surface2:#1F232C; --border:#242933; --border2:#1C202A; --border3:#20242E; --track:#242935; --nav:#10131A; --field:#0F1218; --card2:#12151C; --chip:#1A1D25; --hero1:#1B1F29; --hero2:#15181F; --text:#F4F6FA; --text2:#C7CDD9; --muted:#9AA3B2; --muted3:#6B7280; --accent:#7C6CF6; --accent2:#A99BFF; --accentdeep:#4F46E5; --green:#34D399; --greentext:#6EE7B7; --greenbg:#10271F; --greenpill:#12261B; --rose:#FB7185; --rosebg:#2A1619; --violetbg:#241E3C; --violetborder:#2E2655; --violetchipborder:#3B2F63; --cyan:#22D3EE; --amber:#FBBF24; }
  body.light{ --bg:#F3F5F9; --surface:#FFFFFF; --surface2:#EDF0F5; --border:#E3E7EE; --border2:#E6EAF1; --border3:#E3E7EE; --track:#E3E7EE; --nav:#FFFFFF; --field:#EDF0F5; --card2:#F6F8FB; --chip:#EDF0F5; --hero1:#FFFFFF; --hero2:#EEF2F7; --text:#141821; --text2:#2B3240; --muted:#5B6472; --muted3:#7A8494; --accent:#6D5EF0; --accent2:#6D5EF0; --accentdeep:#4F46E5; --green:#059669; --greentext:#0E9F6E; --greenbg:#DCFCE7; --greenpill:#DCFCE7; --rose:#E11D48; --rosebg:#FEE2E2; --violetbg:#EDE9FE; --violetborder:#DDD6FE; --violetchipborder:#C4B5FD; --cyan:#0891B2; --amber:#D97706; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);
    font-family:-apple-system,Roboto,"Segoe UI",system-ui,sans-serif;
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  .hidden{display:none!important}
  button{font-family:inherit;cursor:pointer}
  .screen{padding:22px 18px 92px;max-width:560px;margin:0 auto}
  h1{font-size:22px;font-weight:700;margin:0}
  .muted{color:var(--muted)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px;margin-top:14px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .pill{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:600}
  .label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}
  .big{font-size:30px;font-weight:700;line-height:1.1}
  .btn{border:none;border-radius:12px;padding:12px 16px;font-size:13.5px;font-weight:600;min-height:44px}
  .btn-stop{background:var(--rosebg);color:var(--rose)}
  .btn-go{background:var(--greenbg);color:var(--green)}
  .btn-accent{background:var(--accent);color:#fff}
  .btn-soft{background:var(--surface2);color:var(--accent2);border:1px solid var(--violetborder)}
  .btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}
  .btn-wide{width:100%;display:flex;align-items:center;justify-content:center;gap:9px}
  .chips{display:flex;gap:8px;margin-top:12px}
  .chip{flex:1;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:12.5px;font-weight:600;border-radius:10px;padding:10px 0;min-height:42px}
  .chip.on{background:var(--violetbg);border-color:var(--violetchipborder);color:var(--accent2)}
  .bar{height:7px;border-radius:999px;background:var(--track);overflow:hidden;margin-top:6px}
  .bar>span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--green),var(--cyan))}
  input{width:100%;background:var(--field);border:1px solid var(--border);border-radius:12px;color:var(--text);
    padding:13px 14px;font-size:14px;margin-top:6px}
  label.fld{display:block;margin-top:14px;font-size:12.5px;color:var(--muted)}
  nav{position:fixed;left:0;right:0;bottom:0;height:68px;background:var(--nav);border-top:1px solid var(--border2);
    display:flex;align-items:center;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom)}
  nav button{background:none;border:none;color:var(--muted3);font-size:10.5px;font-weight:600;
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 10px}
  nav button.on{color:var(--accent2)}
  nav svg{width:21px;height:21px}
  .svc{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .list .it{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--border)}
  .list .it:first-child{border-top:none}
  .overlay{position:fixed;inset:0;background:rgba(5,6,9,.74);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
  .modal{width:100%;max-width:330px;background:var(--hero2);border:1px solid var(--border);border-radius:22px;padding:24px;text-align:center}
  .toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--border3);border:1px solid var(--border);
    color:var(--text);padding:11px 16px;border-radius:12px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s}
  .toast.show{opacity:1}
  .seg{display:flex;gap:6px;background:var(--field);border:1px solid var(--border);border-radius:12px;padding:5px;margin-top:8px}
  .seg button{flex:1;border:none;background:transparent;color:var(--muted);font-weight:600;font-size:12.5px;padding:10px 0;border-radius:9px;min-height:42px}
  .seg button.on{background:var(--violetbg);color:var(--accent2)}
  .ss{width:100%;border-radius:12px;border:1px solid var(--border);margin-top:12px;display:block}
  .hdr{display:flex;align-items:center;gap:11px}
  .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accentdeep));display:flex;align-items:center;justify-content:center;flex:none}
  select{width:100%;background:var(--field);border:1px solid var(--border);border-radius:12px;color:var(--text);padding:13px 14px;font-size:14px;margin-top:6px}
</style>
</head>
<body>

<!-- ================= SETUP ================= -->
<div id="setup" class="screen hidden">
  <div class="hdr">
    <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" class="svc" style="stroke:#fff"><path d="M12 3v9"/><path d="M6.4 6.4a8 8 0 1 0 11.2 0"/></svg></div>
    <h1>WorkspaceHelper</h1>
  </div>
  <p class="muted" style="margin-top:14px" data-t="setup_intro"></p>
  <div class="card">
    <label class="fld"><span data-t="fb_url"></span>
      <input id="in_url" placeholder="https://your-project-default-rtdb.firebaseio.com" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
    <label class="fld"><span data-t="fb_secret"></span>
      <input id="in_secret" placeholder="••••••••" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
    <button class="btn btn-accent btn-wide" style="margin-top:18px" onclick="saveSetup()" data-t="connect"></button>
    <p id="setup_err" class="muted" style="color:var(--rose);font-size:12.5px;margin-top:10px"></p>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app" class="hidden">

  <!-- HOME -->
  <section id="s_home" class="screen">
    <div class="row">
      <div class="hdr">
        <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" class="svc" style="stroke:#fff"><path d="M12 3v9"/><path d="M6.4 6.4a8 8 0 1 0 11.2 0"/></svg></div>
        <h1 style="font-size:18px">WorkspaceHelper</h1>
      </div>
      <span id="pc_pill" class="pill" style="background:var(--chip);color:var(--muted)"><span class="dot" style="background:var(--muted)"></span><span id="pc_pill_t">—</span></span>
    </div>

    <div class="card" style="background:linear-gradient(160deg,var(--hero1),var(--hero2))">
      <div class="row" style="align-items:flex-start">
        <div>
          <div class="label">DeskTime</div>
          <div style="display:flex;align-items:center;gap:9px;margin-top:7px">
            <span id="dt_dot" class="dot" style="background:var(--muted)"></span>
            <span id="dt_state" class="big" style="font-size:22px" data-t="unknown"></span>
          </div>
          <div id="dt_since" class="muted" style="font-size:12.5px;margin-top:4px"></div>
        </div>
        <div style="text-align:right">
          <div id="dt_total" class="big" style="font-size:26px">—</div>
          <div class="muted" style="font-size:11.5px" data-t="worked_today"></div>
        </div>
      </div>
      <div style="margin-top:16px">
        <div class="row" style="font-size:11.5px"><span class="muted" data-t="productivity"></span><span id="dt_prod" style="color:var(--greentext);font-weight:600">—</span></div>
        <div class="bar"><span id="dt_prod_bar" style="width:0%"></span></div>
      </div>
    </div>

    <div class="label" style="margin-top:16px" data-t="controls"></div>

    <!-- DeskTime control -->
    <div class="card">
      <div class="row">
        <div>
          <div style="font-weight:600;font-size:14.5px" data-t="desktime_proc"></div>
          <div class="muted" style="font-size:11.5px" data-t="open_close"></div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-go" onclick="confirmDesktime('start')" data-t="start"></button>
          <button class="btn btn-stop" onclick="confirmDesktime('stop')" data-t="stop"></button>
        </div>
      </div>
      <div class="chips" id="dt_chips">
        <button class="chip" onclick="dtTimer(this,15)">15m</button>
        <button class="chip" onclick="dtTimer(this,30)">30m</button>
        <button class="chip" onclick="dtTimer(this,60)">1h</button>
      </div>
    </div>

    <!-- Mouse control -->
    <div class="card">
      <div class="row">
        <div>
          <div style="font-weight:600;font-size:14.5px" data-t="mouse_helper"></div>
          <div class="muted" style="font-size:11.5px" data-t="keeps_active"></div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-go" id="mouse_go" onclick="mouse('start')" data-t="start"></button>
          <button class="btn btn-stop" onclick="mouse('stop')" data-t="stop"></button>
        </div>
      </div>
      <div class="chips" id="ms_chips">
        <button class="chip" onclick="setMouseTimer(this,15)">15m</button>
        <button class="chip" onclick="setMouseTimer(this,30)">30m</button>
        <button class="chip" onclick="setMouseTimer(this,60)">1h</button>
        <button class="chip on" onclick="setMouseTimer(this,0)" data-t="off"></button>
      </div>
    </div>

    <button class="btn btn-soft btn-wide" style="margin-top:14px" onclick="go('screen')" data-t="confirm_screen"></button>
    <button class="btn btn-stop btn-wide" style="margin-top:12px" onclick="panic()" data-t="panic"></button>
    <div id="last_seen" class="muted" style="font-size:11px;text-align:center;margin-top:16px"></div>
  </section>

  <!-- HOURS -->
  <section id="s_hours" class="screen hidden">
    <h1 data-t="desktime_hours"></h1>
    <div class="card" style="background:linear-gradient(160deg,var(--hero1),var(--hero2))">
      <div class="row" style="align-items:flex-end">
        <div><div class="label" data-t="time_worked"></div><div id="h_total" class="big" style="font-size:36px;margin-top:4px">—</div></div>
        <div style="text-align:right"><div class="muted" style="font-size:11.5px" data-t="effectiveness"></div><div id="h_eff" class="big" style="font-size:22px;color:var(--greentext)">—</div></div>
      </div>
      <div style="display:flex;gap:10px;margin-top:16px">
        <div class="card" style="flex:1;margin:0;background:var(--card2)"><div class="muted" style="font-size:11px" data-t="arrived"></div><div id="h_arr" style="font-weight:600;margin-top:2px">—</div></div>
        <div class="card" style="flex:1;margin:0;background:var(--card2)"><div class="muted" style="font-size:11px" data-t="left"></div><div id="h_left" style="font-weight:600;margin-top:2px">—</div></div>
      </div>
    </div>
    <div class="card">
      <div class="row"><span style="font-weight:600;font-size:13px" data-t="productivity"></span><span id="h_prod" style="color:var(--greentext);font-weight:600">—</span></div>
      <div class="bar"><span id="h_prod_bar" style="width:0%"></span></div>
    </div>
    <div class="card"><div style="font-weight:600;font-size:13px;margin-bottom:6px" data-t="projects"></div><div id="proj_list" class="list"></div></div>
    <div class="card"><div style="font-weight:600;font-size:13px;margin-bottom:6px" data-t="top_apps"></div><div id="apps_list" class="list"></div></div>
  </section>

  <!-- SCREEN CHECK -->
  <section id="s_screen" class="screen hidden">
    <h1 data-t="screen_check"></h1>
    <p class="muted" style="font-size:12.5px;margin-top:6px" data-t="screen_note"></p>
    <button class="btn btn-accent btn-wide" onclick="captureScreen()" data-t="capture"></button>
    <div class="card"><div class="row"><span style="font-weight:600;font-size:12.5px" data-t="last_capture"></span><span id="ss_time" class="muted" style="font-size:11.5px">—</span></div>
      <img id="ss_img" class="ss hidden" alt="screenshot" style="cursor:pointer" onclick="openScreenshot()">
      <div id="ss_hint" class="muted hidden" style="font-size:11px;margin-top:6px;text-align:center" data-t="tap_expand"></div>
      <div id="ss_empty" class="muted" style="font-size:12.5px;margin-top:12px" data-t="no_capture"></div>
    </div>
    <button class="btn btn-ghost btn-wide" style="margin-top:14px" onclick="go('home')" data-t="back"></button>
  </section>

  <!-- SETTINGS -->
  <section id="s_settings" class="screen hidden">
    <h1 data-t="settings"></h1>

    <div class="card">
      <div style="font-weight:600;font-size:13px" data-t="appearance"></div>
      <div class="seg"><button id="th_dark" onclick="setTheme('dark')" data-t="dark"></button><button id="th_light" onclick="setTheme('light')" data-t="light"></button></div>
    </div>

    <div class="card">
      <div style="font-weight:600;font-size:13px" data-t="device"></div>
      <select id="dev_select" onchange="selectDevice(this.value)"></select>
    </div>

    <div class="card">
      <div style="font-weight:600;font-size:13px" data-t="language"></div>
      <div class="seg"><button id="lang_en" onclick="setLang('en')">English</button><button id="lang_es" onclick="setLang('es')">Español</button></div>
    </div>

    <div class="card">
      <div class="row"><div><div style="font-weight:600;font-size:14px" data-t="require_fp"></div><div class="muted" style="font-size:11.5px" data-t="fp_sub"></div></div>
        <div class="seg" style="margin:0;width:120px"><button id="fp_on" onclick="setFp(true)" data-t="on"></button><button id="fp_off" onclick="setFp(false)" data-t="off"></button></div></div>
    </div>

    <div class="card">
      <div style="font-weight:600;font-size:13px" data-t="auto_shutdown"></div>
      <div class="row" style="margin-top:10px">
        <input id="shut_time" type="time" style="width:auto;margin:0">
        <div style="display:flex;gap:8px">
          <button class="btn btn-soft" onclick="setShutdown()" data-t="set"></button>
          <button class="btn btn-ghost" onclick="cancelShutdown()" data-t="cancel"></button>
        </div>
      </div>
      <div id="shut_state" class="muted" style="font-size:11.5px;margin-top:8px"></div>
    </div>

    <div class="card">
      <div style="font-weight:600;font-size:13px" data-t="routines"></div>
      <div id="routine_list" class="list" style="margin-top:8px"></div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <input id="r_time" type="time" style="width:auto;margin:0">
        <select id="r_action" style="flex:1;margin:0"></select>
      </div>
      <div id="r_days" style="display:flex;gap:5px;margin-top:10px"></div>
      <div class="muted" style="font-size:10.5px;margin-top:6px" data-t="days_hint"></div>
      <button class="btn btn-soft btn-wide" style="margin-top:10px" onclick="addRoutine()" data-t="add_routine"></button>
    </div>

    <div class="card">
      <div class="row"><div><div style="font-weight:600;font-size:14px" data-t="app_version"></div><div id="ver_line" class="muted" style="font-size:11.5px">v1.0.0</div></div>
        <button class="btn btn-soft" onclick="checkUpdate()" data-t="check_updates"></button></div>
    </div>

    <div class="card">
      <div style="font-weight:600;font-size:13px" data-t="connection"></div>
      <div class="row" style="margin-top:10px"><span class="muted" style="font-size:12.5px" data-t="fb_link"></span><span id="conn_state" class="pill" style="background:var(--greenpill);color:var(--greentext)"><span class="dot" style="background:var(--green)"></span><span data-t="connected"></span></span></div>
      <button class="btn btn-ghost btn-wide" style="margin-top:12px" onclick="editConnection()" data-t="edit_connection"></button>
    </div>
  </section>

  <!-- NAV -->
  <nav>
    <button id="n_home" class="on" onclick="go('home')"><svg viewBox="0 0 24 24" class="svc"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span data-t="home"></span></button>
    <button id="n_hours" onclick="go('hours')"><svg viewBox="0 0 24 24" class="svc"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg><span data-t="hours"></span></button>
    <button id="n_settings" onclick="go('settings')"><svg viewBox="0 0 24 24" class="svc"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H1a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 2.6 7a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H7a1.6 1.6 0 0 0 1-1.5V1a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1 1.6 1.6 0 0 0 .3-1.8"/></svg><span data-t="settings"></span></button>
  </nav>
</div>

<div id="toast" class="toast"></div>

<script>
// ---------------- i18n ----------------
const T = {
  en:{setup_intro:"Enter your Firebase connection to link the app to your PC.",fb_url:"Firebase URL",fb_secret:"Firebase secret",connect:"Connect",
    unknown:"Unknown",worked_today:"worked today",productivity:"Productivity",controls:"Controls",desktime_proc:"DeskTime process",open_close:"Open or close tracking",
    start:"Start",stop:"Stop",mouse_helper:"Mouse helper · F9",keeps_active:"Keeps the PC active",off:"Off",confirm_screen:"Confirm screen status",panic:"Panic · stop everything",
    desktime_hours:"DeskTime hours",time_worked:"Time worked",effectiveness:"Effectiveness",arrived:"Arrived",left:"Left",view_projects:"View projects & apps",
    projects_apps:"Projects & apps",projects:"Projects",top_apps:"Top apps",back:"Back",screen_check:"Screen check",screen_note:"Manual · nothing is captured until you tap.",
    capture:"Capture screen",last_capture:"Last capture",no_capture:"No capture yet.",settings:"Settings",device:"Device",language:"Language",require_fp:"Fingerprint for DeskTime",
    fp_sub:"Confirm before start/stop",on:"On",auto_shutdown:"Auto shutdown",set:"Set",cancel:"Cancel",app_version:"App version",check_updates:"Check",connection:"Connection",
    fb_link:"Firebase link",connected:"Connected",edit_connection:"Edit connection",home:"Home",hours:"Hours",online:"PC online",offline:"PC offline",
    confirm_close:"Close DeskTime?",confirm_open:"Open DeskTime?",confirm_body:"This changes tracking on the PC.",confirm:"Confirm",sent:"Command sent",pick_device:"Select a device",routines:"Scheduled routines",add_routine:"Add routine",no_routines:"No routines yet",close:"Close",tap_expand:"Tap to open full-size",done:"Done",up_to_date:"You're up to date",updated:"Updated",ago:"ago",days_hint:"Leave days unselected to run every day",appearance:"Appearance",dark:"Dark",light:"Light"},
  es:{setup_intro:"Introduce tu conexión de Firebase para enlazar la app con tu PC.",fb_url:"URL de Firebase",fb_secret:"Secreto de Firebase",connect:"Conectar",
    unknown:"Desconocido",worked_today:"trabajado hoy",productivity:"Productividad",controls:"Controles",desktime_proc:"Proceso de DeskTime",open_close:"Abrir o cerrar el seguimiento",
    start:"Iniciar",stop:"Detener",mouse_helper:"Asistente de ratón · F9",keeps_active:"Mantiene la PC activa",off:"Apagado",confirm_screen:"Confirmar estado de pantalla",panic:"Pánico · detener todo",
    desktime_hours:"Horas de DeskTime",time_worked:"Tiempo trabajado",effectiveness:"Efectividad",arrived:"Llegada",left:"Salida",view_projects:"Ver proyectos y apps",
    projects_apps:"Proyectos y apps",projects:"Proyectos",top_apps:"Apps más usadas",back:"Atrás",screen_check:"Captura de pantalla",screen_note:"Manual · no se captura nada hasta que pulses.",
    capture:"Capturar pantalla",last_capture:"Última captura",no_capture:"Aún no hay captura.",settings:"Ajustes",device:"Dispositivo",language:"Idioma",require_fp:"Huella para DeskTime",
    fp_sub:"Confirmar antes de iniciar/detener",on:"Sí",auto_shutdown:"Apagado automático",set:"Fijar",cancel:"Cancelar",app_version:"Versión de la app",check_updates:"Buscar",connection:"Conexión",
    fb_link:"Enlace Firebase",connected:"Conectado",edit_connection:"Editar conexión",home:"Inicio",hours:"Horas",online:"PC en línea",offline:"PC sin conexión",
    confirm_close:"¿Cerrar DeskTime?",confirm_open:"¿Abrir DeskTime?",confirm_body:"Esto cambia el seguimiento en la PC.",confirm:"Confirmar",sent:"Comando enviado",pick_device:"Selecciona un dispositivo",routines:"Rutinas programadas",add_routine:"Añadir rutina",no_routines:"Aún no hay rutinas",close:"Cerrar",tap_expand:"Toca para ver en grande",done:"Hecho",up_to_date:"Ya estás al día",updated:"Actualizado",ago:"atrás",days_hint:"Sin días seleccionados se ejecuta todos los días",appearance:"Apariencia",dark:"Oscuro",light:"Claro"}
};
let lang = localStorage.getItem('lang') || 'en';
function t(k){return (T[lang]&&T[lang][k])||k;}
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
  document.getElementById('lang_en').classList.toggle('on',lang==='en');
  document.getElementById('lang_es').classList.toggle('on',lang==='es');
  fillActionSelect();fillDayChips();
}
function setLang(l){lang=l;localStorage.setItem('lang',l);applyLang();}
function setTheme(mode){
  document.body.classList.toggle('light',mode==='light');
  localStorage.setItem('theme',mode);
  const d=document.getElementById('th_dark'),l=document.getElementById('th_light');
  if(d)d.classList.toggle('on',mode!=='light');
  if(l)l.classList.toggle('on',mode==='light');
}

// ---------------- config ----------------
let cfg = JSON.parse(localStorage.getItem('cfg')||'null');
let deviceId = localStorage.getItem('deviceId')||'';
let mouseMinutes = 0, pollTimer=null, latestSS=0;
const RELEASES="https://github.com/dioniciogarcia/tirsosiguemuerto/releases/latest";

function fbUrl(path){return cfg.url.replace(/\/$/,'')+'/'+path+'.json?auth='+encodeURIComponent(cfg.secret);}
async function fbGet(path){try{const r=await fetch(fbUrl(path));return await r.json();}catch(e){return undefined;}}
async function fbPost(path,body){try{await fetch(fbUrl(path),{method:'POST',body:JSON.stringify(body)});return true;}catch(e){return false;}}
async function fbPut(path,body){try{await fetch(fbUrl(path),{method:'PUT',body:JSON.stringify(body)});return true;}catch(e){return false;}}

// ---------------- setup ----------------
function saveSetup(){
  const url=document.getElementById('in_url').value.trim();
  const secret=document.getElementById('in_secret').value.trim();
  if(!url||!secret){document.getElementById('setup_err').textContent='⚠';return;}
  cfg={url,secret};localStorage.setItem('cfg',JSON.stringify(cfg));
  boot();
}
function editConnection(){localStorage.removeItem('cfg');cfg=null;boot();}

// ---------------- navigation ----------------
function go(name){
  ['home','hours','screen','settings'].forEach(s=>{
    document.getElementById('s_'+s).classList.toggle('hidden',s!==name);
  });
  ['home','hours','settings'].forEach(n=>{
    const b=document.getElementById('n_'+n);if(b)b.classList.toggle('on',n===name);
  });
  if(name==='settings'){fillActionSelect();fillDayChips();loadRoutines();}
  window.scrollTo(0,0);
}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1600);}

// ---------------- commands ----------------
async function send(type,args){
  if(!deviceId){toast(t('pick_device'));go('settings');return;}
  try{
    const r=await fetch(fbUrl('devices/'+deviceId+'/commands'),{method:'POST',body:JSON.stringify({type,args:args||{},ts:Date.now()})});
    const j=await r.json();toast(t('sent'));
    if(j&&j.name)watchAck(j.name);
  }catch(e){toast('✕');}
}
function watchAck(key){
  let tries=0;
  const iv=setInterval(async()=>{
    tries++;
    const a=await fbGet('devices/'+deviceId+'/last_ack');
    if(a&&a.key===key){clearInterval(iv);toast('✓ '+t('done'));}
    else if(tries>=6)clearInterval(iv);
  },1500);
}
function mouse(action){send(action==='start'?'mouse_start':'mouse_stop',{minutes:mouseMinutes});}
function setMouseTimer(el,m){mouseMinutes=m;document.querySelectorAll('#ms_chips .chip').forEach(c=>c.classList.remove('on'));el.classList.add('on');}
function dtTimer(el,m){send('desktime_timer',{minutes:m,direction:'open_then_close'});document.querySelectorAll('#dt_chips .chip').forEach(c=>c.classList.remove('on'));el.classList.add('on');setTimeout(()=>el.classList.remove('on'),1500);}
function panic(){send('panic');}
function setShutdown(){const v=document.getElementById('shut_time').value;if(v){send('shutdown_at',{time:v});document.getElementById('shut_state').textContent='→ '+v;}}
function cancelShutdown(){send('shutdown_cancel');document.getElementById('shut_state').textContent='';}
async function captureScreen(){await send('screenshot');toast(t('sent'));}

// fingerprint-gated confirm (biometric hook added natively later)
let fpOn = localStorage.getItem('fp')!=='0';
function setFp(v){fpOn=v;localStorage.setItem('fp',v?'1':'0');document.getElementById('fp_on').classList.toggle('on',v);document.getElementById('fp_off').classList.toggle('on',!v);}
function confirmDesktime(action){
  if(!fpOn){send(action==='start'?'desktime_start':'desktime_stop');return;}
  if(window.Android&&Android.authenticate){Android.authenticate(action);return;}
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML='<div class="modal"><div style="width:54px;height:54px;border-radius:16px;margin:0 auto;background:'+(action==='stop'?'var(--rosebg)':'var(--greenbg)')+';display:flex;align-items:center;justify-content:center">'
    +'<svg width="26" height="26" viewBox="0 0 24 24" class="svc" style="stroke:'+(action==='stop'?'var(--rose)':'var(--green)')+'"><path d="M12 3v9"/><path d="M6.4 6.4a8 8 0 1 0 11.2 0"/></svg></div>'
    +'<div style="font-size:20px;font-weight:700;margin-top:14px">'+t(action==='stop'?'confirm_close':'confirm_open')+'</div>'
    +'<div class="muted" style="font-size:13px;margin-top:7px">'+t('confirm_body')+'</div>'
    +'<button class="btn btn-accent btn-wide" style="margin-top:18px">'+t('confirm')+'</button>'
    +'<button class="btn btn-ghost btn-wide" style="margin-top:10px">'+t('cancel')+'</button></div>';
  const btns=ov.querySelectorAll('button');
  btns[0].onclick=()=>{send(action==='start'?'desktime_start':'desktime_stop');ov.remove();};
  btns[1].onclick=()=>ov.remove();
  document.body.appendChild(ov);
}

// ---------------- devices ----------------
async function loadDevices(){
  const devs=await fbGet('devices');
  const sel=document.getElementById('dev_select');sel.innerHTML='';
  if(!devs){sel.innerHTML='<option>—</option>';return;}
  const ids=Object.keys(devs);
  ids.forEach(id=>{
    const nm=(devs[id].status&&devs[id].status.device_name)||id;
    const o=document.createElement('option');o.value=id;o.textContent=nm;sel.appendChild(o);
  });
  if(!deviceId||ids.indexOf(deviceId)<0){deviceId=ids[0]||'';localStorage.setItem('deviceId',deviceId);}
  sel.value=deviceId;
}
function selectDevice(id){deviceId=id;localStorage.setItem('deviceId',id);refresh();}

// ---------------- rendering ----------------
function hms(sec){sec=sec||0;const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60);return h+'h '+(m<10?'0':'')+m+'m';}
async function refresh(){
  if(!cfg||!deviceId)return;
  const st=await fbGet('devices/'+deviceId+'/status');
  const online = st && st.online && (Date.now()/1000 - (st.ts||0) < 30);
  const pill=document.getElementById('pc_pill');
  document.getElementById('pc_pill_t').textContent = online? t('online'):t('offline');
  pill.querySelector('.dot').style.background = online? 'var(--green)':'var(--rose)';
  pill.style.color = online? 'var(--greentext)':'var(--rose)';

  const ls=document.getElementById('last_seen');
  if(ls){
    if(st&&st.ts){const age=Math.max(0,Math.round(Date.now()/1000-st.ts));
      ls.textContent=t('updated')+' '+(age<60?age+'s':Math.round(age/60)+'m')+' '+t('ago');}
    else ls.textContent='';
  }

  const running = st && st.desktime_running;
  document.getElementById('dt_dot').style.background = running? 'var(--green)':'var(--muted)';
  document.getElementById('dt_state').textContent = running? (lang==='es'?'En marcha':'Running') : (lang==='es'?'Detenido':'Stopped');

  const h = st && st.hours;
  if(h){
    document.getElementById('dt_total').textContent=hms(h.desktimeTime);
    document.getElementById('h_total').textContent=hms(h.desktimeTime);
    const p=Math.round(h.productivity||0);
    document.getElementById('dt_prod').textContent=p+'%';
    document.getElementById('dt_prod_bar').style.width=p+'%';
    document.getElementById('h_prod').textContent=p+'%';
    document.getElementById('h_prod_bar').style.width=p+'%';
    document.getElementById('h_eff').textContent=(h.efficiency!=null?Math.round(h.efficiency):'—')+'%';
    document.getElementById('h_arr').textContent=(h.arrived||'—').slice(11,16)||'—';
    document.getElementById('h_left').textContent=h.left?h.left.slice(11,16):'—';
    document.getElementById('dt_since').textContent=(h.arrived?((lang==='es'?'Desde ':'Since ')+h.arrived.slice(11,16)):'');
    renderProjects(h.projects||[]);renderApps(h.apps||[]);
  }
}
function renderProjects(list){
  const el=document.getElementById('proj_list');el.innerHTML='';
  if(!list.length){el.innerHTML='<div class="muted" style="font-size:12.5px;padding:8px 0">—</div>';return;}
  list.slice(0,6).forEach(p=>{
    const d=document.createElement('div');d.className='it';
    d.innerHTML='<span class="dot" style="background:var(--accent)"></span><div style="flex:1;min-width:0"><div style="font-size:13.5px">'+esc(p.task_title||p.project_title||'—')+'</div></div><span class="muted" style="font-size:12.5px">'+hms(p.duration)+'</span>';
    el.appendChild(d);
  });
}
function renderApps(list){
  const el=document.getElementById('apps_list');el.innerHTML='';
  const col={productive:'var(--green)',neutral:'var(--muted3)',unproductive:'var(--rose)'};
  if(!list.length){el.innerHTML='<div class="muted" style="font-size:12.5px;padding:8px 0">—</div>';return;}
  list.slice(0,8).forEach(a=>{
    const d=document.createElement('div');d.className='it';
    d.innerHTML='<span class="dot" style="background:'+(col[a.productivity]||'var(--muted3)')+'"></span><span style="flex:1;font-size:13.5px">'+esc(a.name||'—')+'</span><span class="muted" style="font-size:12.5px">'+hms(a.duration)+'</span>';
    el.appendChild(d);
  });
}
function esc(s){return (s+'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

async function pollScreenshot(){
  if(document.getElementById('s_screen').classList.contains('hidden'))return;
  const ss=await fbGet('devices/'+deviceId+'/status/screenshot');
  if(ss&&ss.jpg_b64&&ss.ts!==latestSS){
    latestSS=ss.ts;
    const img=document.getElementById('ss_img');
    img.src='data:image/jpeg;base64,'+ss.jpg_b64;img.classList.remove('hidden');
    document.getElementById('ss_empty').classList.add('hidden');
    document.getElementById('ss_hint').classList.remove('hidden');
    document.getElementById('ss_time').textContent=new Date(ss.ts*1000).toLocaleTimeString();
  }
}
const APK_URL="https://github.com/dioniciogarcia/tirsosiguemuerto/releases/download/app-latest/WorkspaceHelper.apk";
function openScreenshot(){
  const img=document.getElementById('ss_img');
  if(!img.src||img.classList.contains('hidden'))return;
  const ov=document.createElement('div');ov.className='overlay';
  ov.style.cssText='position:fixed;inset:0;background:#000;z-index:70;display:flex;flex-direction:column;padding:0';
  const scroll=document.createElement('div');
  scroll.style.cssText='flex:1;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;align-items:center;justify-content:center';
  const big=document.createElement('img');big.src=img.src;big.style.cssText='max-width:none;width:auto;height:auto;display:block';
  scroll.appendChild(big);
  const bar=document.createElement('div');bar.style.cssText='padding:12px;display:flex;justify-content:center';
  const close=document.createElement('button');close.className='btn btn-ghost';close.style.minWidth='140px';close.textContent=t('close');
  close.onclick=()=>ov.remove();bar.appendChild(close);
  ov.appendChild(scroll);ov.appendChild(bar);document.body.appendChild(ov);
}
const VER_URL="https://github.com/dioniciogarcia/tirsosiguemuerto/releases/download/app-latest/version.txt";
let updOverlay=null;
async function checkUpdate(){
  if(!(window.Android&&Android.installUpdate)){window.open(RELEASES,'_blank');return;}
  let latest=null;try{latest=(await (await fetch(VER_URL,{cache:'no-store'})).text()).trim();}catch(e){}
  const cur=Android.appVersion?Android.appVersion():'';
  if(latest&&cur&&latest===cur){toast(t('up_to_date'));return;}
  showUpdateProgress();Android.installUpdate(APK_URL);
}
function showUpdateProgress(){
  if(updOverlay)return;
  const ov=document.createElement('div');ov.className='overlay';ov.style.zIndex='80';
  ov.innerHTML='<div class="modal"><div id="upd_title" style="font-weight:700;font-size:16px">'+(lang==='es'?'Descargando actualización…':'Downloading update…')+'</div>'
    +'<div class="bar" style="margin-top:16px;height:10px"><span id="upd_bar" style="width:0%"></span></div>'
    +'<div id="upd_pct" class="muted" style="font-size:12.5px;margin-top:8px">0%</div></div>';
  document.body.appendChild(ov);updOverlay=ov;
}
window.onUpdateProgress=function(p){
  if(!updOverlay)return;
  const bar=updOverlay.querySelector('#upd_bar'),pct=updOverlay.querySelector('#upd_pct');
  if(bar)bar.style.width=p+'%';if(pct)pct.textContent=p+'%';
  if(p>=100){const tl=updOverlay.querySelector('#upd_title');if(tl)tl.textContent=(lang==='es'?'Abriendo instalador…':'Opening installer…');
    setTimeout(()=>{if(updOverlay){updOverlay.remove();updOverlay=null;}},1800);}
};
window.onUpdateFailed=function(){if(updOverlay){updOverlay.remove();updOverlay=null;}toast('✕');};
window.onAuth=function(action,ok){if(ok)send(action==='start'?'desktime_start':'desktime_stop');else toast('✕');};

// ---------------- routines ----------------
const R_ACTIONS=[['desktime_open','Open DeskTime','Abrir DeskTime'],['desktime_close','Close DeskTime','Cerrar DeskTime'],['mouse_start','Mouse helper 1h','Asistente ratón 1h'],['shutdown','Shut down PC','Apagar PC']];
const DAY_LETTERS={en:['M','T','W','T','F','S','S'],es:['L','M','X','J','V','S','D']}; // index 0=Monday .. 6=Sunday
let selDays=[];
function dayLetters(){return DAY_LETTERS[lang==='es'?'es':'en'];}
function fillActionSelect(){const s=document.getElementById('r_action');if(!s)return;const cur=s.value;s.innerHTML='';R_ACTIONS.forEach(a=>{const o=document.createElement('option');o.value=a[0];o.textContent=lang==='es'?a[2]:a[1];s.appendChild(o);});if(cur)s.value=cur;}
function fillDayChips(){
  const el=document.getElementById('r_days');if(!el)return;el.innerHTML='';
  dayLetters().forEach((d,i)=>{const b=document.createElement('button');b.className='chip'+(selDays.includes(i)?' on':'');b.textContent=d;b.style.cssText='flex:1;padding:7px 0;min-height:36px';
    b.onclick=()=>{selDays=selDays.includes(i)?selDays.filter(x=>x!==i):selDays.concat(i);fillDayChips();};el.appendChild(b);});
}
async function loadRoutines(){
  const el=document.getElementById('routine_list');if(!el||!deviceId)return;
  const r=await fbGet('devices/'+deviceId+'/routines');el.innerHTML='';
  if(!r){el.innerHTML='<div class="muted" style="font-size:12px;padding:6px 0">'+t('no_routines')+'</div>';return;}
  Object.keys(r).forEach(k=>{const it=r[k];if(!it||typeof it!=='object')return;
    const lbl=R_ACTIONS.find(a=>a[0]===it.type);const name=lbl?(lang==='es'?lbl[2]:lbl[1]):it.type;
    const daysTxt=(it.days&&it.days.length)?' · '+it.days.map(d=>dayLetters()[d]).join(''):'';
    const on=it.enabled!==false;
    const row=document.createElement('div');row.className='it';
    row.innerHTML='<span style="flex:1;font-size:13px'+(on?'':';opacity:.45')+'">'+esc(it.time||'')+' · '+esc(name)+esc(daysTxt)+'</span>';
    const tog=document.createElement('button');tog.className='btn '+(on?'btn-go':'btn-ghost');tog.style.cssText='padding:7px 11px;min-height:36px;font-size:12px;margin-right:6px';tog.textContent=on?t('on'):t('off');
    tog.onclick=()=>toggleRoutine(k,!on);
    const del=document.createElement('button');del.className='btn btn-stop';del.style.cssText='padding:7px 12px;min-height:36px;font-size:13px';del.textContent='✕';del.onclick=()=>deleteRoutine(k);
    row.appendChild(tog);row.appendChild(del);el.appendChild(row);});
}
async function addRoutine(){
  if(!deviceId){toast(t('pick_device'));return;}
  const time=document.getElementById('r_time').value;const type=document.getElementById('r_action').value;
  if(!time)return;const body={type,time,enabled:true};if(type==='mouse_start')body.minutes=60;
  if(selDays.length)body.days=selDays.slice().sort((a,b)=>a-b);
  await fbPost('devices/'+deviceId+'/routines',body);toast(t('sent'));selDays=[];fillDayChips();loadRoutines();
}
async function toggleRoutine(k,on){try{await fetch(fbUrl('devices/'+deviceId+'/routines/'+k),{method:'PATCH',body:JSON.stringify({enabled:on})});}catch(e){}loadRoutines();}
async function deleteRoutine(k){try{await fetch(fbUrl('devices/'+deviceId+'/routines/'+k),{method:'DELETE'});}catch(e){}loadRoutines();}

// ---------------- boot ----------------
async function boot(){
  applyLang();
  setTheme(localStorage.getItem('theme')||'dark');
  if(window.Android&&Android.appVersion){try{document.getElementById('ver_line').textContent='v'+Android.appVersion();}catch(e){}}
  if(!cfg){document.getElementById('setup').classList.remove('hidden');document.getElementById('app').classList.add('hidden');return;}
  document.getElementById('setup').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  setFp(fpOn);go('home');
  await loadDevices();await refresh();
  if(pollTimer)clearInterval(pollTimer);
  pollTimer=setInterval(()=>{refresh();pollScreenshot();},4000);
}
boot();
</script>
